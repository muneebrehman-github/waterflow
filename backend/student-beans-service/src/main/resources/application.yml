server:
  port: 8080

spring:
  application:
    name: student-beans-service

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

student-beans:
  offer-slug: lyca-mobile
  default-country: us
  connect-base-url: https://connect.studentbeans.com/v4
  mock-discount-code: STUDENT-LYCA-10
  mock-discount-percent: 10
  verification-ttl-hours: 24
  cors-allowed-origins:
    - http://localhost:5500
    - http://127.0.0.1:5500
    - https://www.lycamobile.us
    - https://lycamobile.us
    - https://stage.ldsvcplatform.com
  iframe-allowed-origins:
    - https://www.lycamobile.us
    - https://www.lycamobile.co.uk
    - https://stage.ldsvcplatform.com
    - https://cms-modern.studentbeans.com

logging:
  level:
    com.spgg.studentbeans: DEBUG
